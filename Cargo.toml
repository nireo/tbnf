[package]
name = "tbnf"
version = "0.1.0"
edition = "2024"
description = "A fast fuzzy terminal file navigator"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ignore = "0.4"
infer = "0.22"
nucleo-matcher = "0.3"
open = "5.4"
ratatui = "0.30"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
